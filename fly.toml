# Beefcake platform, hosted for the workshop. One shared instance the room
# clicks; nobody runs `npm run dev`. Deployed and reseeded by
# beefcake-workshop/workshop/setup/deploy-platform.sh the evening before.
#
# Stop the machine between workshops (`fly machine stop`); a stopped machine
# costs cents a month and the volume keeps the database.

app = "beefcake-platform"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  BEEFCAKE_DB = "/data/beefcake.db"
  PORT = "3000"

[mounts]
  source = "beefcake_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Off: the reseed runs over ssh for minutes with no HTTP traffic, and the
  # proxy must not stop the machine under it. The facilitator stops it by hand.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
