name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - '*/release/**'
      - '*/hotfix/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs in UTC. Anything that reads the host timezone will diverge from a
  # developer's laptop, which is the point of pinning it here rather than
  # matching Stockholm.
  TZ: UTC

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  seed:
    name: Seed at full scale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The reset has to stay fast enough that people run it without thinking,
      # so CI builds the production-shaped database on every change.
      - name: Rebuild the database
        run: npm run db:reset -- --quiet

      - name: Build
        run: npm run build

  # Disabled: the PR video evidence will read the Gherkin from the tickets linked
  # to the PR instead of specs/. Until then the @acceptance tests run in the e2e
  # job without the recorded PR comment. Re-enable by removing `if: false`.
  acceptance:
    name: Playwright acceptance scenarios
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed
        run: npm run db:reset -- --scale small --quiet

      - name: Run the acceptance scenarios linked from specs/
        id: bdd-tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/bdd-results.json
        run: npm run test:e2e -- --grep @acceptance --project=chromium --reporter=list,html,json

      - name: Build video timelines from recorded test steps
        if: ${{ !cancelled() }}
        run: node .github/scripts/bdd-timeline.cjs

      - uses: actions/upload-artifact@v7
        id: bdd-artifact
        if: ${{ !cancelled() }}
        with:
          name: playwright-acceptance-report
          path: |
            playwright-report/
            test-results/
            specs/
          retention-days: 7

      - name: Publish spec summary and recording links
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          BDD_TEST_OUTCOME: ${{ steps.bdd-tests.outcome }}
          BDD_ARTIFACT_URL: ${{ steps.bdd-artifact.outputs.artifact-url }}
        with:
          script: |
            const { publish } = require('./.github/scripts/bdd-pr-comment.cjs');
            await publish({ github, context, core });

  e2e:
    name: End-to-end flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Seed
        run: npm run db:reset -- --scale small --quiet

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
