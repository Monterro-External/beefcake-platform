name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - '*/release/**'
      - '*/hotfix/**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs in UTC. Anything that reads the host timezone will diverge from a
  # developer's laptop, which is the point of pinning it here rather than
  # matching Stockholm.
  TZ: UTC

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  seed:
    name: Seed at full scale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The reset has to stay fast enough that people run it without thinking,
      # so CI builds the production-shaped database on every change.
      - name: Rebuild the database
        run: npm run db:reset -- --quiet

      - name: Build
        run: npm run build

  # Records the @acceptance scenarios of the Specs this PR links and posts them on
  # the PR: PR → linked BCPLA ticket → parent Spec → the scenarios the ticket
  # covers. Every other Spec's scenarios run, unrecorded, in the e2e job.
  # See docs/testing/pr-evidence.md.
  acceptance:
    name: Playwright acceptance scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # Before any install: a PR that links no Spec has nothing to record, and
      # installing Chromium alone can take minutes.
      - name: Find the Specs this PR links
        id: linked
        uses: actions/github-script@v9
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const { findLinkedSpecs } = require('./.github/scripts/bdd-pr-comment.cjs');
            await findLinkedSpecs({ github, context, core });

      - uses: actions/setup-node@v7
        if: ${{ steps.linked.outputs.grep != '' }}
        with:
          node-version: 22
          cache: npm

      - if: ${{ steps.linked.outputs.grep != '' }}
        run: npm ci

      - name: Install Chromium
        if: ${{ steps.linked.outputs.grep != '' }}
        run: npx playwright install --with-deps chromium

      - name: Seed
        if: ${{ steps.linked.outputs.grep != '' }}
        run: npm run db:reset -- --scale small --quiet

      # A Spec linked before its tests exist passes with nothing to run.
      - name: Run the linked Specs' @acceptance scenarios
        id: bdd-tests
        if: ${{ steps.linked.outputs.grep != '' }}
        env:
          BDD_GREP: ${{ steps.linked.outputs.grep }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/bdd-results.json
        run: npm run test:e2e -- --grep "$BDD_GREP" --grep-invert @wip --pass-with-no-tests --project=chromium --reporter=list,html,json

      # Playwright's server writes to data/e2e-dev.log, not to Playwright's output.
      - name: Server log
        if: ${{ failure() }}
        run: tail -n 300 data/e2e-dev.log || true

      - name: Build video timelines from recorded test steps
        if: ${{ !cancelled() && steps.bdd-tests.outcome != 'skipped' }}
        run: node .github/scripts/bdd-timeline.cjs

      - uses: actions/upload-artifact@v7
        id: bdd-artifact
        if: ${{ !cancelled() && steps.bdd-tests.outcome != 'skipped' }}
        with:
          name: playwright-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3

      - name: Publish the Spec's scenarios and recording links
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        env:
          BDD_TEST_OUTCOME: ${{ steps.bdd-tests.outcome }}
          BDD_ARTIFACT_URL: ${{ steps.bdd-artifact.outputs.artifact-url }}
          # A Linear API key with read access to BCPLA. Without it the comment says
          # the tickets could not be read and the check does not fail.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const { publish } = require('./.github/scripts/bdd-pr-comment.cjs');
            await publish({ github, context, core });

  e2e:
    name: End-to-end flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Seed
        run: npm run db:reset -- --scale small --quiet

      # Every Spec's @acceptance scenarios run here too, unrecorded, so a PR cannot
      # break another Spec unnoticed. The acceptance job records the linked ones.
      - run: npm run test:e2e -- --grep-invert @wip
        env:
          BDD_RECORDING: 'off'

      # Playwright's server writes to data/e2e-dev.log, not to Playwright's output.
      - name: Server log
        if: ${{ failure() }}
        run: tail -n 300 data/e2e-dev.log || true

      # Only a failure needs the report; passing runs would fill the storage quota.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
